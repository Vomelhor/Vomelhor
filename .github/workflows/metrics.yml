name: Update GitHub Metrics

on:
  # Regenerate every Sunday at midnight UTC
  schedule:
    - cron: "0 0 * * 0"
  # Trigger manually from the Actions tab (run this first!)
  workflow_dispatch:
  # Also update on pushes to main
  push:
    branches:
      - main

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15

    steps:
      # ── Step 1: Overview card ─────────────────────────────────────────
      # Generates: metrics/overview.svg
      # Contains : account header stats + isometric 3D contribution calendar
      # Replaces : github-readme-stats (unreliable Vercel) + streak-stats (unreliable demolab)
      - name: Generate overview metrics (header + isocalendar)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vomelhor

          template: classic
          base: header, activity, community, repositories, metadata

          # Isometric 3D calendar — beautiful replacement for streak-stats
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          config_timezone: America/Chicago
          filename: metrics/overview.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update overview metrics [skip ci]"

      # ── Step 2: Language breakdown card ──────────────────────────────
      # Generates: metrics/languages.svg
      # Contains : in-depth language analysis (clones repos and counts real lines of code)
      # Replaces : github-readme-stats top-langs card (unreliable Vercel)
      #
      # NOTE: plugin_languages_indepth clones your public repos to count lines of code.
      # If it times out or errors, set it to "no" for the basic (faster) version.
      # For private repos you need a PAT with "repo" scope saved as secret METRICS_TOKEN.
      - name: Generate language breakdown
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Vomelhor

          template: classic
          base: ""

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2%
          plugin_languages_indepth: yes
          plugin_languages_sections: most-used

          config_timezone: America/Chicago
          filename: metrics/languages.svg
          output_action: commit
          committer_branch: main
          committer_message: "chore: update language metrics [skip ci]"
