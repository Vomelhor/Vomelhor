<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" preserveAspectRatio="xMidYMid meet">
<defs>

  <radialGradient id="bg" cx="50%" cy="35%">
    <stop offset="0%" stop-color="#151c2e"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </radialGradient>

  <linearGradient id="wg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF2E97"/>
    <stop offset="50%" stop-color="#7B2FF7"/>
    <stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>

  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softglow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="b"/>
    <feMergeNode in="b"/>
  </filter>

  <!-- name typewriter mask -->
  <clipPath id="nm">
    <rect x="115" y="42" height="52" width="0">
      <animate attributeName="width" values="0;0;570;570" keyTimes="0;0.013;0.087;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- subtitle reveal mask -->
  <clipPath id="sm">
    <rect x="0" y="92" height="26" width="0">
      <animate attributeName="width" values="0;0;900;900" keyTimes="0;0.12;0.17;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- tech row 1 mask -->
  <clipPath id="t1m">
    <rect x="0" y="127" height="22" width="0">
      <animate attributeName="width" values="0;0;900;900" keyTimes="0;0.18;0.23;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- tech row 2 mask -->
  <clipPath id="t2m">
    <rect x="0" y="150" height="22" width="0">
      <animate attributeName="width" values="0;0;900;900" keyTimes="0;0.23;0.28;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <!-- phrase masks (cycling terminal line, starts t=9s) -->
  <clipPath id="p1">
    <rect x="215" y="199" height="24" width="0">
      <animate attributeName="width" values="0;0;443;443;0;0" keyTimes="0;0.30;0.35;0.50;0.54;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="p2">
    <rect x="215" y="199" height="24" width="0">
      <animate attributeName="width" values="0;0;432;432;0;0" keyTimes="0;0.55;0.60;0.73;0.77;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>
  <clipPath id="p3">
    <rect x="215" y="199" height="24" width="0">
      <animate attributeName="width" values="0;0;356;356;0;0" keyTimes="0;0.78;0.83;0.95;0.99;1" dur="30s" repeatCount="indefinite"/>
    </rect>
  </clipPath>

  <style>
    .mono { font-family: 'Courier New', monospace; }
    .sans { font-family: Arial, sans-serif; }
  </style>
</defs>

