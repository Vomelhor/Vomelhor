</g>
<text x="780" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#00D9FF" fill-opacity=".65">Repositories</text>
<text x="780" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" fill-opacity=".4">First Repository</text>
