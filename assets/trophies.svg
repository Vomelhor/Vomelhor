</g>
<text x="516" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#00D9FF" fill-opacity=".65">Followers</text>
<text x="516" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" fill-opacity=".4">First Friend</text>
<text x="516" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#00D9FF" fill-opacity=".5">2 pts</text>
</g>

<!-- ── CARD 5 · PullRequest · C · purple · cx=648 ───────────────────── -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.58s" fill="freeze"/>
<rect x="588" y="5" width="120" height="130" rx="8" fill="#0B0A14" stroke="#7B2FF7" stroke-opacity=".2" stroke-width="1"/>
<circle cx="696" cy="18" r="9" fill="#7B2FF7" fill-opacity=".1" stroke="#7B2FF7" stroke-opacity=".4" stroke-width="1"/>
