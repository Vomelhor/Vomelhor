<!-- ── CARD 6 · Repositories · C · cyan · cx=780 ────────────────────── -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.70s" fill="freeze"/>
<rect x="720" y="5" width="120" height="130" rx="8" fill="#081014" stroke="#00D9FF" stroke-opacity=".2" stroke-width="1"/>
<circle cx="828" cy="18" r="9" fill="#00D9FF" fill-opacity=".1" stroke="#00D9FF" stroke-opacity=".4" stroke-width="1"/>
<text x="828" y="22" text-anchor="middle" font-family="Courier New,monospace" font-size="9" font-weight="700" fill="#00D9FF" fill-opacity=".6">C</text>
