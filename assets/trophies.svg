  <rect x="-14" y="42" width="28" height="6" rx="2" fill="#FFD700"/>
  <circle cx="0" cy="-7" r="5" fill="#ffffff" fill-opacity=".15"/>
</g>
<text x="384" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#FFD700" fill-opacity=".65">Stars</text>
<text x="384" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" fill-opacity=".4">First Star</text>
<text x="384" y="128" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#FFD700" fill-opacity=".5">1 pt</text>
</g>

<!-- ── CARD 4 · Followers · C · cyan · cx=516 ───────────────────────── -->
<g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.4s" begin="0.46s" fill="freeze"/>
<rect x="456" y="5" width="120" height="130" rx="8" fill="#081014" stroke="#00D9FF" stroke-opacity=".2" stroke-width="1"/>
