<text x="648" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#7B2FF7" fill-opacity=".65">PullRequest</text>
<text x="648" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#ffffff" fill-opacity=".4">First Pull</text>
