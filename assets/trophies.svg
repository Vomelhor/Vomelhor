  <path d="M-20,4 C-24,-8 -16,-18 0,-18 C16,-18 24,-8 20,4 C20,22 10,32 0,32 C-10,32 -20,22 -20,4 Z" fill="#7B2FF7"/>
  <path d="M-20,8 C-30,8 -30,20 -20,20" fill="none" stroke="#7B2FF7" stroke-width="5" stroke-linecap="round"/>
  <path d="M20,8 C30,8 30,20 20,20" fill="none" stroke="#7B2FF7" stroke-width="5" stroke-linecap="round"/>
  <rect x="-4" y="32" width="8" height="10" fill="#7B2FF7"/>
