<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140">
<defs>
  <linearGradient id="ftBg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0D1117"/>
    <stop offset="100%" stop-color="#090d14"/>
  </linearGradient>
  <!-- Wave layers: front is most opaque / fastest, back is faintest / slowest -->
  <linearGradient id="ftW1" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity=".9"/>
    <stop offset="50%" stop-color="#7B2FF7" stop-opacity=".9"/>
    <stop offset="100%" stop-color="#FF2E97" stop-opacity=".9"/>
  </linearGradient>
  <linearGradient id="ftW2" x1="100%" y1="0%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#7B2FF7" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="ftW3" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FF2E97" stop-opacity=".25"/>
    <stop offset="100%" stop-color="#7B2FF7" stop-opacity=".25"/>
  </linearGradient>
  <linearGradient id="ftBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity=".5"/>
    <stop offset="50%" stop-color="#7B2FF7" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#FF2E97" stop-opacity=".5"/>
  </linearGradient>
  <filter id="ftGlow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!-- Clip waves to top strip only -->
  <clipPath id="ftWaveClip">
    <rect x="0" y="0" width="900" height="65"/>
  </clipPath>
  <!-- Text reveal -->
  <clipPath id="ftTextClip">
    <rect x="0" y="97" height="28" width="0">
      <animate attributeName="width" from="0" to="900" dur="0.8s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    </rect>
  </clipPath>
</defs>

<!-- Background -->
<rect width="900" height="140" fill="url(#ftBg)"/>

<!-- Twinkling starfield in the dark lower area -->
<circle cx="15"  cy="73"  r=".9"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.3s" repeatCount="indefinite" begin="0.4s"/></circle>
<circle cx="110" cy="78"  r=".7"  fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/></circle>
<circle cx="220" cy="72"  r="1"   fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.8s" repeatCount="indefinite" begin="0.7s"/></circle>
<circle cx="350" cy="76"  r=".8"  fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="1.9s" repeatCount="indefinite" begin="2.3s"/></circle>
<circle cx="480" cy="71"  r="1.1" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="3.1s" repeatCount="indefinite" begin="0.5s"/></circle>
<circle cx="610" cy="78"  r=".7"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="2.0s" repeatCount="indefinite" begin="1.8s"/></circle>
<circle cx="740" cy="73"  r=".9"  fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="1.6s" repeatCount="indefinite" begin="3.0s"/></circle>
<circle cx="870" cy="76"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.5s" repeatCount="indefinite" begin="1.0s"/></circle>
<circle cx="55"  cy="92"  r=".8"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="2.1s" repeatCount="indefinite" begin="2.6s"/></circle>
<circle cx="175" cy="97"  r="1"   fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="1.7s" repeatCount="indefinite" begin="0.9s"/></circle>
<circle cx="290" cy="90"  r=".7"  fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.7s" repeatCount="indefinite" begin="3.3s"/></circle>
<circle cx="415" cy="95"  r="1.2" fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.5s" repeatCount="indefinite" begin="1.5s"/></circle>
<circle cx="540" cy="88"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.9s" repeatCount="indefinite" begin="2.0s"/></circle>
<circle cx="665" cy="96"  r=".9"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.2s" repeatCount="indefinite" begin="0.3s"/></circle>
<circle cx="800" cy="91"  r=".7"  fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.8s" repeatCount="indefinite" begin="3.5s"/></circle>
<circle cx="30"  cy="113" r="1"   fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.4s" repeatCount="indefinite" begin="1.3s"/></circle>
<circle cx="150" cy="118" r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="1.9s" repeatCount="indefinite" begin="2.8s"/></circle>
<circle cx="270" cy="110" r=".9"  fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="3.0s" repeatCount="indefinite" begin="0.6s"/></circle>
<circle cx="395" cy="120" r=".7"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="2.3s" repeatCount="indefinite" begin="1.7s"/></circle>
<circle cx="510" cy="112" r="1.1" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="1.6s" repeatCount="indefinite" begin="3.2s"/></circle>
<circle cx="630" cy="118" r=".8"  fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.7s" repeatCount="indefinite" begin="0.8s"/></circle>
<circle cx="755" cy="108" r="1"   fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="2.1s" repeatCount="indefinite" begin="2.4s"/></circle>
<circle cx="880" cy="115" r=".9"  fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="1.8s" repeatCount="indefinite" begin="1.1s"/></circle>
<circle cx="450" cy="130" r=".7"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="3.4s" repeatCount="indefinite" begin="2.9s"/></circle>
<circle cx="680" cy="128" r=".8"  fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.0s" repeatCount="indefinite" begin="0.2s"/></circle>

<!-- Animated wave layers clipped to top 65px -->
<g clip-path="url(#ftWaveClip)">
  <!-- Back wave: slowest, faintest -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="16s" repeatCount="indefinite" calcMode="linear"/>
    <path d="M0,48 C225,30 675,64 900,48 C1125,30 1575,64 1800,48 L1800,140 L0,140 Z" fill="url(#ftW3)"/>
  </g>
  <!-- Middle wave -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="-300,0" to="-1200,0" dur="11s" repeatCount="indefinite" calcMode="linear"/>
    <path d="M0,38 C150,18 300,56 450,32 C600,8 750,52 900,28 C1050,4 1200,50 1350,26 C1500,2 1650,48 1800,24 L1800,140 L0,140 Z" fill="url(#ftW2)"/>
  </g>
  <!-- Front wave: fastest, most vivid -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="8s" repeatCount="indefinite" calcMode="linear"/>
    <path d="M0,28 C112,8 225,48 450,20 C675,-8 788,42 900,16 C1012,-10 1125,44 1350,18 C1575,-8 1688,40 1800,14 L1800,140 L0,140 Z" fill="url(#ftW1)"/>
  </g>
</g>

<!-- Scanline sweep -->
<rect y="0" height="140" width="150" rx="75" fill="#7B2FF7" fill-opacity="0">
  <animate attributeName="fill-opacity" values="0;0.04;0" dur="8s" begin="2s" repeatCount="indefinite"/>
  <animate attributeName="x" from="-150" to="900" dur="8s" begin="2s" repeatCount="indefinite" calcMode="linear"/>
</rect>

<!-- Text glow layer -->
<g clip-path="url(#ftTextClip)" opacity="0">
  <animate attributeName="opacity" values="0;0.4" dur="0.5s" begin="0.3s" fill="freeze"/>
  <text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="2" fill="#ffffff" filter="url(#ftGlow)">built with ♥ by @Vomelhor</text>
</g>
<!-- Text sharp layer -->
<g clip-path="url(#ftTextClip)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  <text x="450" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="2"><tspan fill="#ffffff" fill-opacity=".7">built with </tspan><tspan fill="#FF2E97">♥</tspan><tspan fill="#ffffff" fill-opacity=".7"> by </tspan><tspan fill="#00D9FF" font-weight="700">@Vomelhor</tspan></text>
</g>

<!-- Bottom accent bar -->
<rect x="0" y="138" width="900" height="2" fill="url(#ftBar)"/>

</svg>
