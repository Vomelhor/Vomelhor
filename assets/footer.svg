<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 100">
<defs>
  <!-- Static viewport gradient: pink (left) → purple → cyan (right) -->
  <linearGradient id="ftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FF2E97"/>
    <stop offset="50%"  stop-color="#7B2FF7"/>
    <stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>
  <linearGradient id="ftBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#FF2E97" stop-opacity=".5"/>
    <stop offset="50%"  stop-color="#7B2FF7" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity=".5"/>
  </linearGradient>
  <filter id="ftGlow" x="-30%" y="-100%" width="160%" height="300%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <!--
    Each wave period = 900px, animation = translate(0→-900).
    y(x=0) = y(x=900) = y(x=1800) with matching tangents → zero-seam loop.
    Control points are symmetric across the 900px period so tangents match
    exactly at every tile boundary (e.g. back wave: C200,30 700,66 → end
    tangent (200,-18) equals start tangent of next tile C1100,30 → (200,-18)).
  -->
  <mask id="waveMask">
    <rect width="900" height="100" fill="black"/>
    <!-- Back wave: slowest, faintest — peak y=30, trough y=66 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="16s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M0,48 C200,30 700,66 900,48 C1100,30 1600,66 1800,48 L1800,100 L0,100 Z" fill="white" opacity=".3"/>
    </g>
    <!-- Middle wave — peak y=15, trough y=55 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="11s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M0,35 C200,15 700,55 900,35 C1100,15 1600,55 1800,35 L1800,100 L0,100 Z" fill="white" opacity=".6"/>
    </g>
    <!-- Front wave: fastest, most vivid — peak y=6, trough y=50 -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-900,0" dur="8s" repeatCount="indefinite" calcMode="linear"/>
      <path d="M0,28 C200,6 700,50 900,28 C1100,6 1600,50 1800,28 L1800,100 L0,100 Z" fill="white" opacity=".9"/>
    </g>
  </mask>
  <!-- Text reveal — clip rect aligned to actual text body (baseline y=76, font 13px → body y=63-76) -->
  <clipPath id="ftTextClip">
    <rect x="0" y="60" height="22" width="0">
      <animate attributeName="width" from="0" to="900" dur="0.8s" begin="0.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    </rect>
  </clipPath>
</defs>

<!-- Background -->
<rect width="900" height="100" fill="url(#ftBg)"/>

<!-- Static gradient revealed through animated wave mask -->
<rect width="900" height="100" fill="url(#ftGrad)" mask="url(#waveMask)"/>

<!-- Twinkling stars over the waves -->
<circle cx="15"  cy="72"  r=".9"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.3s" repeatCount="indefinite" begin="0.4s"/></circle>
<circle cx="110" cy="67"  r=".7"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.8s" repeatCount="indefinite" begin="1.2s"/></circle>
<circle cx="220" cy="74"  r="1"   fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.8s" repeatCount="indefinite" begin="0.7s"/></circle>
<circle cx="350" cy="69"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="1.9s" repeatCount="indefinite" begin="2.3s"/></circle>
<circle cx="480" cy="73"  r="1.1" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="3.1s" repeatCount="indefinite" begin="0.5s"/></circle>
<circle cx="610" cy="68"  r=".7"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="2.0s" repeatCount="indefinite" begin="1.8s"/></circle>
<circle cx="740" cy="71"  r=".9"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="1.6s" repeatCount="indefinite" begin="3.0s"/></circle>
<circle cx="870" cy="66"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.5s" repeatCount="indefinite" begin="1.0s"/></circle>
<circle cx="55"  cy="90"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.1s" repeatCount="indefinite" begin="2.6s"/></circle>
<circle cx="175" cy="86"  r="1"   fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="1.7s" repeatCount="indefinite" begin="0.9s"/></circle>
<circle cx="290" cy="92"  r=".7"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.7s" repeatCount="indefinite" begin="3.3s"/></circle>
<circle cx="415" cy="88"  r="1.2" fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.5s" repeatCount="indefinite" begin="1.5s"/></circle>
<circle cx="540" cy="91"  r=".8"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="2.9s" repeatCount="indefinite" begin="2.0s"/></circle>
<circle cx="665" cy="87"  r=".9"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.2s" repeatCount="indefinite" begin="0.3s"/></circle>
<circle cx="800" cy="93"  r=".7"  fill="#ffffff" opacity="0"><animate attributeName="opacity" values="0;.4;0" dur="1.8s" repeatCount="indefinite" begin="3.5s"/></circle>

<!-- Text glow layer -->
<g clip-path="url(#ftTextClip)" opacity="0">
  <animate attributeName="opacity" values="0;0.4" dur="0.5s" begin="0.3s" fill="freeze"/>
  <text x="450" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="2" fill="#ffffff" filter="url(#ftGlow)">built with ♥ by @Vomelhor</text>
</g>
<!-- Text sharp layer -->
<g clip-path="url(#ftTextClip)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.3s" fill="freeze"/>
  <text x="450" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="2"><tspan fill="#ffffff" fill-opacity=".85">built with </tspan><tspan fill="#FF2E97">♥</tspan><tspan fill="#ffffff" fill-opacity=".85"> by </tspan><tspan fill="#00D9FF" font-weight="700">@Vomelhor</tspan></text>
</g>

<!-- Bottom accent bar -->
<rect x="0" y="98" width="900" height="2" fill="url(#ftBar)"/>

</svg>
