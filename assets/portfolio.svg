<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150">
<defs>
  <radialGradient id="pfbg" cx="40%" cy="40%">
    <stop offset="0%" stop-color="#161B26"/>
    <stop offset="100%" stop-color="#0D1117"/>
  </radialGradient>
  <linearGradient id="pfbar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D9FF" stop-opacity=".5"/>
    <stop offset="50%" stop-color="#7B2FF7" stop-opacity=".5"/>
    <stop offset="100%" stop-color="#FF2E97" stop-opacity=".5"/>
  </linearGradient>
  <linearGradient id="pfTitle" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00D9FF"/>
    <stop offset="50%" stop-color="#7B2FF7"/>
    <stop offset="100%" stop-color="#FF2E97"/>
  </linearGradient>
  <linearGradient id="addrBg" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1C2436"/>
    <stop offset="100%" stop-color="#161B26"/>
  </linearGradient>
  <filter id="pfGlow" x="-10%" y="-60%" width="120%" height="220%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- URL typewriter clip -->
  <clipPath id="urlClip">
    <rect x="152" y="17" height="22" width="0">
      <animate attributeName="width" from="0" to="230" dur="0.7s" begin="0.6s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    </rect>
  </clipPath>
  <!-- Title reveal clip -->
  <clipPath id="pfTitleClip">
    <rect x="0" y="58" height="56" width="0">
      <animate attributeName="width" from="0" to="900" dur="0.6s" begin="1.5s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    </rect>
  </clipPath>
  <!-- Subtitle reveal clip -->
  <clipPath id="pfSubClip">
    <rect x="0" y="112" height="26" width="0">
      <animate attributeName="width" from="0" to="900" dur="0.5s" begin="2.1s" repeatCount="1" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    </rect>
  </clipPath>
</defs>

<!-- Background -->
<rect width="900" height="150" fill="url(#pfbg)"/>
<rect x="0" y="0" width="900" height="2" fill="url(#pfbar)"/>
<rect x="0" y="148" width="900" height="2" fill="url(#pfbar)"/>

<!-- Browser chrome top strip -->
<rect x="0" y="2" width="900" height="50" fill="#0a0e17" fill-opacity=".7"/>
<rect x="0" y="51" width="900" height="1" fill="url(#pfbar)" opacity=".35"/>

<!-- Scanline sweep (continuous after load) -->
<rect y="4" height="143" width="120" rx="60" fill="#7B2FF7" fill-opacity="0">
  <animate attributeName="fill-opacity" values="0;0.04;0" dur="6s" begin="3s" repeatCount="indefinite"/>
  <animate attributeName="x" from="-120" to="900" dur="6s" begin="3s" repeatCount="indefinite" calcMode="linear"/>
</rect>

<!-- Window dots (fade in at start) -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.1s" fill="freeze"/>
  <circle cx="28" cy="27" r="6" fill="#FF5F57"/>
  <circle cx="48" cy="27" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="27" r="6" fill="#28C840"/>
</g>

<!-- Address bar pill -->
<rect x="100" y="15" width="680" height="25" rx="12.5" fill="url(#addrBg)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.3s" begin="0.4s" fill="freeze"/>
</rect>

<!-- Lock icon -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0.55" dur="0.3s" begin="0.55s" fill="freeze"/>
  <rect x="136" y="24" width="7" height="5.5" rx="1" fill="#4a5568"/>
  <path d="M137.5 24 C137.5 21 141.5 21 141.5 24" fill="none" stroke="#4a5568" stroke-width="1.3" stroke-linecap="round"/>
</g>

<!-- URL text (typewriter reveal) -->
<g clip-path="url(#urlClip)">
  <text x="152" y="32" font-family="'Courier New',monospace" font-size="12.5" fill="#c9d1d9">vomelhor.github.io</text>
</g>

<!-- URL cursor (blinks while typing, then fades out) -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.05s" begin="0.6s" fill="freeze"/>
  <animate attributeName="opacity" values="1;0" dur="0.25s" begin="1.35s" fill="freeze"/>
  <rect y="19" width="2" height="13" rx="1" fill="#00D9FF">
    <animate attributeName="x" from="152" to="368" dur="0.7s" begin="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".25 .1 .25 1"/>
    <animate attributeName="opacity" values="1;0" dur="0.5s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
</g>

<!-- LIVE indicator (pill badge, top-right) -->
<g opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" begin="1.1s" fill="freeze"/>
  <rect x="818" y="15" width="62" height="25" rx="12.5" fill="#00FF88" fill-opacity="0.1" stroke="#00FF88" stroke-width="1" stroke-opacity="0.5"/>
  <!-- Pulsing dot -->
  <circle cx="832" cy="27.5" r="4.5" fill="#00FF88">
    <animate attributeName="r" values="4.5;6;4.5" dur="1.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Expanding ring -->
  <circle cx="832" cy="27.5" r="4.5" fill="none" stroke="#00FF88" stroke-width="1.5">
    <animate attributeName="r" values="4.5;12" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="843" y="32" font-family="Arial,sans-serif" font-size="10" font-weight="700" fill="#00FF88">LIVE</text>
</g>

<!-- ── Content area ─────────────────────────────────── -->

<!-- Title glow (blurred layer) -->
<g clip-path="url(#pfTitleClip)" opacity="0">
  <animate attributeName="opacity" values="0;0.45" dur="0.5s" begin="1.5s" fill="freeze"/>
  <text x="34" y="102" font-family="Arial,sans-serif" font-size="36" font-weight="900" letter-spacing="3" fill="url(#pfTitle)" filter="url(#pfGlow)">PERSONAL PORTFOLIO</text>
</g>
<!-- Title sharp layer -->
<g clip-path="url(#pfTitleClip)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.5s" fill="freeze"/>
  <text x="34" y="102" font-family="Arial,sans-serif" font-size="36" font-weight="900" letter-spacing="3" fill="url(#pfTitle)">PERSONAL PORTFOLIO</text>
</g>

<!-- Subtitle -->
<g clip-path="url(#pfSubClip)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" begin="2.1s" fill="freeze"/>
  <text x="36" y="131" font-family="'Courier New',monospace" font-size="12" fill="#ffffff" fill-opacity=".4" letter-spacing="1.5">full-stack · ui systems · creative developer</text>
</g>

<!-- Right-side floating particles (appear after content loads) -->
<circle cx="810" cy="78" r="1.2" fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.7;0" dur="2.4s" repeatCount="indefinite" begin="2.5s"/></circle>
<circle cx="840" cy="96" r=".8"  fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="3.1s" repeatCount="indefinite" begin="3.2s"/></circle>
<circle cx="868" cy="70" r="1"   fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.8s" repeatCount="indefinite" begin="2.9s"/></circle>
<circle cx="828" cy="118" r=".9" fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.6;0" dur="1.9s" repeatCount="indefinite" begin="3.5s"/></circle>
<circle cx="858" cy="132" r="1.1" fill="#7B2FF7" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.5s" repeatCount="indefinite" begin="2.3s"/></circle>
<circle cx="890" cy="100" r=".7" fill="#FF2E97" opacity="0"><animate attributeName="opacity" values="0;.7;0" dur="3.4s" repeatCount="indefinite" begin="3.0s"/></circle>
<circle cx="880" cy="82" r=".9"  fill="#00D9FF" opacity="0"><animate attributeName="opacity" values="0;.5;0" dur="2.1s" repeatCount="indefinite" begin="2.7s"/></circle>

<!-- Left accent bar (vertical gradient line) -->
<rect x="0" y="54" width="3" height="94" fill="url(#pfTitle)" opacity="0">
  <animate attributeName="opacity" values="0;0.6" dur="0.4s" begin="1.4s" fill="freeze"/>
  <animate attributeName="opacity" values="0.6;0.3;0.6" dur="3s" begin="2s" repeatCount="indefinite"/>
</rect>

</svg>
